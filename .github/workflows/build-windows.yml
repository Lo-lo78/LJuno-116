name: Build LJuno-116 VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check preset browser persistence
        shell: pwsh
        run: |
          python Tests/check_persistent_browser_recall.py
          python Tests/check_browser_commit_only.py

      - name: Validate help and About metadata
        shell: pwsh
        run: |
          python Tests/check_help_about_09957.py
          python Tests/test120_incremental_parameter_search.py
          python Tests/test121_free_lfo_host_play.py
          python Tests/test122_sampler_reverbs.py
          python Tests/test106e_legato_chain.py
          python Tests/test106f_length_recall.py
          python Tests/test107_64_patterns.py
          python Tests/test108_pattern_announcement.py
          python Tests/test109_default_pattern_pauses.py
          python Tests/test110_note_and_length_recall.py
          python Tests/test111_altq_parameter_focus.py
          python Tests/test112_windows_utf8_regression.py
          python Tests/test113_midi_step_entry.py
          python Tests/test114_step_entry_speech_song_context.py
          python Tests/test115_preview_direct_silent_space.py
          python Tests/test119_altq_bpm_division.py
          python Tests/test_midi_key_speech.py
          python Tests/test_midi_entry_esc.py
          python Tests/test_midi_entry_session_transaction.py

      - name: Build Release VST3
        shell: pwsh
        run: ./Tools/build-windows.ps1

      # TEST120 incremental-search regression remains part of this TEST121 build.
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = "build/nmake-release/LJuno116_artefacts/Release/VST3/LJuno-116.vst3"
          if (-not (Test-Path -LiteralPath $plugin)) {
            throw "Built VST3 not found at $plugin"
          }
          Compress-Archive -Path $plugin -DestinationPath "LJuno-116-Windows-VST3.zip" -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LJuno-116-0.99.57-TEST122-Sampler-Room-Hall-Plate-Cathedral-Windows-VST3
          path: LJuno-116-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 14
